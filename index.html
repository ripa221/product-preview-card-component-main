<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
<link rel="stylesheet" href="styles.css">

<!-- Montserrat Font Link -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Young+Serif&display=swap" rel="stylesheet">


<!-- Fraunces Font Link -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Outfit:wght@100..900&family=Young+Serif&display=swap" rel="stylesheet">

<!-- Website Title -->
  <title>Frontend Mentor | Product preview card component</title>
 
</head>

<!-- Main Body -->
<body class="container">

  <!-- Card Section -->
<main class="card">

  <!-- Product Image -->
  <img src="images/image-product-desktop.jpg" alt="A Perfume Image with Around Green Leaves" class="product-img">

  <!-- Products Description  -->
 <article class="product-description-content">
   <p class="products">Perfume</p>

   <!-- Product Name -->
<h1 class="product-name">  Gabrielle Essence Eau De Parfum
</h1>

<!-- Product Briefing -->
<p class="product-description">  A floral, solar and voluptuous interpretation composed by Olivier Polge, 
  Perfumer-Creator for the House of CHANEL.
</p>

<!-- Product Price -->
<p class="current-price">  $149.99
</p> 
<p class="previous-price"> $169.99
</p>

<!-- A Button with Add-to-cart -->
<button class="add-cart"> <img src="images/icon-cart.svg" alt="Add To Cart Icon" class="add-cart-img"> Add to Cart
</button> 
 </article> 
</main>


<!-- Footer Section -->
<footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://www.frontendmentor.io/profile/ripa221
">Shahrima Akter Ripa</a>.
  </footer>
</body>
</html>
